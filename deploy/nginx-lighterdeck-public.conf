# lighterdeck.xyz: the public read-only deck (PUBLIC_MODE=1 on 127.0.0.1:8210), behind Cloudflare.
# certbot --nginx adds the 443 server and the redirect from http.

map $http_upgrade $lighterdeck_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.lighterdeck.xyz;
    return 301 https://lighterdeck.xyz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lighterdeck.xyz;

    client_max_body_size 64k;

    location /ws {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lighterdeck_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
